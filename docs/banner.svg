<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" fill="none" role="img" aria-label="JobLens Admin Console">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b0d17"/>
      <stop offset="0.55" stop-color="#101229"/>
      <stop offset="1" stop-color="#0a1626"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c6cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="word" x1="220" y1="0" x2="820" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#c7c2ff"/>
      <stop offset="1" stop-color="#7c6cff"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1380 80) rotate(130) scale(360 300)">
      <stop stop-color="#7c6cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 420) rotate(-40) scale(420 320)">
      <stop stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7c6cff" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="420" rx="28" fill="url(#glowA)"/>
  <rect width="1600" height="420" rx="28" fill="url(#glowB)"/>

  <g opacity="0.05" stroke="#7c6cff">
    <path d="M0 105h1600M0 210h1600M0 315h1600"/>
    <path d="M200 0v420M500 0v420M800 0v420M1100 0v420M1400 0v420"/>
  </g>

  <rect x="72" y="126" width="128" height="128" rx="34" fill="url(#mark)" filter="url(#shadow)"/>
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="136" cy="190" r="37"/>
    <circle cx="136" cy="190" r="20"/>
    <circle cx="136" cy="190" r="6" fill="#ffffff"/>
  </g>

  <text x="232" y="212" fill="url(#word)" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="96" font-weight="700" letter-spacing="-2">JobLens</text>
  <text x="238" y="262" fill="#a8b0d8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="27" font-weight="500" letter-spacing="4">ADMIN CONSOLE</text>

  <text x="234" y="332" fill="#d7dbf5" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="23" font-weight="400">Fresher hiring intelligence for the LinkedIn job dataset</text>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="600">
    <rect x="234" y="360" width="150" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="259" y="385" fill="#c9cdf0">React + Vite</text>
    <rect x="398" y="360" width="164" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="423" y="385" fill="#c9cdf0">Express API</text>
    <rect x="576" y="360" width="158" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="601" y="385" fill="#c9cdf0">MongoDB</text>
    <rect x="748" y="360" width="128" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="773" y="385" fill="#c9cdf0">JWT auth</text>
  </g>

  <g transform="translate(1195 120)">
    <rect width="330" height="188" rx="22" fill="#0e1124" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="28" y="44" fill="#8890b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2">MARKET PULSE</text>
    <text x="28" y="92" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="38" font-weight="700">365 roles</text>
    <text x="28" y="122" fill="#a8b0d8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16">across 240 companies</text>
    <rect x="28" y="144" width="274" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="28" y="144" width="214" height="8" rx="4" fill="url(#mark)"/>
    <text x="28" y="174" fill="#7c6cff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="600">100% search coverage</text>
  </g>
</svg>
